name: Shots
options:
  bundleIdPrefix: com.terminal

targets:
  Shots:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shots
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TARGETED_DEVICE_FAMILY: "1"
